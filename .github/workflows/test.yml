name: "Test"

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Test build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ['ai.server', 'botmux', 'double-take', 'double-take-beta', 'shelley']
      fail-fast: false
    steps:
      - name: Free disk space
        if: matrix.target == 'ai.server'
        run: |
          curl -L -k https://raw.githubusercontent.com/apache/flink/master/tools/azure-pipelines/free_disk_space.sh | bash

      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Test build
        uses: home-assistant/builder@master
        with:
          args: |
            --test \
            --amd64 \
            --aarch64 \
            --no-latest \
            -i hassio-addon-${{ matrix.target }}-{arch} \
            --target ${{ matrix.target }} \
            --docker-hub ghcr.io/${{ env.OWNER_LC }}
